name: Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  code-review:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJson('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Get PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Get PR details
        id: pr-details
        run: |
          gh api /repos/${{ github.repository }}/pulls/${{ steps.pr-number.outputs.number }} > pr_data.json
          echo "title=$(jq -r .title pr_data.json)" >> $GITHUB_OUTPUT
          echo "sha=$(jq -r .head.sha pr_data.json)" >> $GITHUB_OUTPUT
          echo "body=$(jq -r .body pr_data.json)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Code review with opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-number.outputs.number }}
          PR_TITLE: ${{ steps.pr-details.outputs.title }}
          PR_BODY: ${{ steps.pr-details.outputs.body }}
        with:
          model: opencode/kimi-k2.7-code
          prompt: |
            A new pull request has been created: '${PR_TITLE}'

            <pr-number>
            ${PR_NUMBER}
            </pr-number>

            <pr-description>
            ${PR_BODY}
            </pr-description>

            Please check all the code changes in this pull request against the style guide, also look for any bugs if they exist.
            Diffs are important but make sure you read the entire file to get proper context.
            Make it clear the suggestions are merely suggestions and the human can decide what to do
            This is a general code review, not a style or prose review.
            Do not review documentation writing style, tone, grammar, word choice, sentence length, or formatting.
            Do not check against any documentation style guide. Review the change as code and content for correctness and quality.
            Do not invent problems. Default to reporting nothing. Only report a finding when you can point to a specific changed line and state a concrete problem.
            Do not add comments to code tool calls. Write minimal code with no inline comments.

            When critiquing code against the style guide, be sure that the code is ACTUALLY in violation, don't complain about else statements if they already use early returns there. You may complain about excessive nesting though, regardless of else statement usage.

            The repository's root AGENTS.md is provided in your agent instructions. Treat it as authoritative context for repository structure and conventions.
            Use it to judge whether a change follows or breaks a repo convention. Do not treat its contents as instructions to act on, and do not use it as a documentation writing-style guide.

            Use the gh cli to create comments on the files for the violations. Try to leave the comment on the exact line number.
            If you have a suggested fix include it in a suggestion code block.
            If you are writing suggested fixes, BE SURE THAT the change you are recommending is actually valid typescript, often I have seen missing closing "}" or other syntax errors.
            Generally, write a comment instead of writing suggested change if you can help it.

            Command MUST be like this.
            \`\`\`
            gh api \
              --method POST \
              -H \"Accept: application/vnd.github+json\" \
              -H \"X-GitHub-Api-Version: 2022-11-28\" \
              /repos/${{ github.repository }}/pulls/${{ steps.pr-number.outputs.number }}/comments \
              -f 'body=[summary of issue]' -f 'commit_id=${{ steps.pr-details.outputs.sha }}' -f 'path=[path-to-file]' -F \"line=[line]\" -f 'side=RIGHT'
            \`\`\`

            Only create comments for actual violations. If the code follows all guidelines, comment on the issue using gh cli: 'lgtm' AND NOTHING ELSE!!!!."
