services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    entrypoint: weed
    command: ["mini", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: wingsdevaccesskey
      AWS_SECRET_ACCESS_KEY: wingsdevsecretkey
      S3_BUCKET: default-bucket
      S3_TABLE_BUCKET: default-catalog
    ports:
      - "8333:8333"
      - "8181:8181"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8333"]
      interval: 2s
      timeout: 3s
      retries: 15

  wings:
    image: docker.useairfoil.com/airfoil/wings:0.1.0-alpha.16
    command:
      - dev
      - --server.address=0.0.0.0:7777
    container_name: wings-dev
    environment:
      - RUST_LOG=debug
      - WINGS_OBJECT_STORE_TYPE=aws
      - WINGS_OBJECT_STORE_BUCKET_NAME=default-bucket
      - AWS_ACCESS_KEY_ID=wingsdevaccesskey
      - AWS_SECRET_ACCESS_KEY=wingsdevsecretkey
      - AWS_ENDPOINT_URL=http://seaweedfs:8333
      - AWS_ALLOW_HTTP=true
    extra_hosts:
      - "seaweedfs:host-gateway"
    ports:
      - "7777:7777"
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  seaweedfs-data:
